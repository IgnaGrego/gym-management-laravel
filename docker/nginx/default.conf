server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Livewire serves its JS/update endpoints dynamically from Laravel
    # (not as static files). Route these to index.php BEFORE the static
    # asset rule, otherwise /livewire/*.js is 404'd as a missing file.
    location /livewire/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Filament assets (published to public/vendor)
    location /vendor {
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }
}
