# SDD workflow state — Gym Management
#
# Single source of truth for SDD progress. Only the Orchestrator writes this file.
#
# project:          static project metadata
# current:          what the Orchestrator is doing right now
#   spec:           SPEC ID being processed, or null when idle
#   phase:          idle | analysis | architecture | implementation | review | blocked
#   status:         idle | in_progress | completed | blocked
# specifications:   keyed by SPEC ID
# history:          bounded audit trail of transitions (keep small)
#
# Valid spec statuses:
#   pending, analysis, spec_ready, architecture, architecture_ready,
#   implementation, implementation_ready, review, blocked, completed
#
# Valid transitions:
#   pending              -> analysis
#   analysis             -> spec_ready | blocked
#   spec_ready           -> architecture
#   architecture         -> architecture_ready | blocked
#   architecture_ready   -> implementation
#   implementation       -> implementation_ready | blocked
#   implementation_ready -> review
#   review               -> completed | implementation | blocked
#   blocked              -> analysis | architecture | implementation (cause resolved)
#
# Per-spec fields:
#   name, status, depends_on, agents (analyst/architect/developer/reviewer),
#   review (result/report), implementation_attempts, block (reason/by),
#   last_agent, updated_at
#
# History entry format:
#   - timestamp: <iso>
#     spec: SPEC-XXX
#     from: <phase>
#     to: <phase>
#     agent: <analyst|architect|developer|reviewer>
#     result: <success|fail|blocked>

